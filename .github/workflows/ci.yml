name: Learnova Build

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore packages
        run: dotnet restore Learnova.sln

      - name: Build project
        run: dotnet build Learnova.sln --configuration Release --no-restore
